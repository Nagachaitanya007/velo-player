name: Build APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - name: Install SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Build
        run: chmod +x ./gradlew && ./gradlew :app:assembleDebug --no-daemon --stacktrace
      - name: Collect APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Lumen.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.9.${{ github.run_number }}
          name: Lumen ${{ github.run_number }}
          files: Lumen.apk
          make_latest: true
          body: |
            Android test build of Lumen.
            Download Lumen.apk and open it on your phone. Android warns about an unknown developer on test installs. That is expected.
            Playback uses libVLC. Files stay on the phone.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
