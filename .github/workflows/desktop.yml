name: Desktop

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install WiX
        shell: pwsh
        run: |
          choco install wixtoolset --no-progress -y
          $candle = Get-ChildItem "C:\Program Files*\WiX Toolset*" -Recurse -Filter candle.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($candle) { echo $candle.DirectoryName >> $env:GITHUB_PATH }
      - name: Bundle VLC
        shell: pwsh
        run: |
          $zip = "$env:TEMP\vlc.zip"
          Invoke-WebRequest -Uri "https://download.videolan.org/pub/videolan/vlc/3.0.21/win64/vlc-3.0.21-win64.zip" -OutFile $zip
          Expand-Archive $zip -DestinationPath "$env:TEMP\vlc-src" -Force
          $src = Get-ChildItem "$env:TEMP\vlc-src" -Directory | Select-Object -First 1
          New-Item -ItemType Directory -Force -Path desktop\vlc-bundle | Out-Null
          Copy-Item "$($src.FullName)\libvlc.dll" desktop\vlc-bundle\
          Copy-Item "$($src.FullName)\libvlccore.dll" desktop\vlc-bundle\
          Copy-Item "$($src.FullName)\plugins" desktop\vlc-bundle\plugins -Recurse
      - name: Package exe
        working-directory: desktop
        run: ../gradlew.bat packageExe --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: velo-windows
          path: desktop/build/compose/binaries/main/**/*.exe
          if-no-files-found: error

  mac-arm:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Bundle VLC
        run: |
          curl -L -o /tmp/vlc.dmg "https://download.videolan.org/pub/videolan/vlc/3.0.21/macosx/vlc-3.0.21-arm64.dmg"
          hdiutil attach /tmp/vlc.dmg -nobrowse -mountpoint /tmp/vlc-mount
          rm -rf desktop/vlc-bundle
          mkdir -p desktop/vlc-bundle/lib desktop/vlc-bundle/plugins
          cp /tmp/vlc-mount/VLC.app/Contents/MacOS/lib/libvlc*.dylib desktop/vlc-bundle/lib/
          cp -R /tmp/vlc-mount/VLC.app/Contents/MacOS/plugins/. desktop/vlc-bundle/plugins/
          hdiutil detach /tmp/vlc-mount
          python3 desktop/scripts/mac-rpath.py desktop/vlc-bundle
      - name: Package dmg
        working-directory: desktop
        run: ../gradlew packageDmg --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: velo-mac
          path: desktop/build/compose/binaries/main/**/*.dmg
          if-no-files-found: error

  release:
    needs: [windows, mac-arm]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
      - name: Rename
        run: |
          find velo-windows -name '*.exe' -exec cp {} Velo-windows.exe \;
          find velo-mac -name '*.dmg' -exec cp {} Velo-mac.dmg \;
          ls -lh Velo-*
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v1.3.1" Velo-windows.exe Velo-mac.dmg \
            --repo Nagachaitanya007/velo-player \
            --title "Velo 1.3.1" \
            --notes "$(cat <<'EOF'
          Velo 1.3.1. Fixes the home screen, which was drawing the title and the chips on top of each other.

          - Velo-windows.exe is the Windows installer.
          - Velo-mac.dmg is for Apple silicon.
          - Velo.apk is the Android build, added to this release.

          Folders, rows, and grid are unchanged. On a Mac, if the system says the app cannot be opened, right-click Velo and choose Open.

          Files stay on the device. Nothing is uploaded.
          EOF
          )"
