name: Build APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install SDK packages
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          mkdir -p "$SDK"
          SM=$(find "$SDK" -path '*/bin/sdkmanager' -type f | head -1 || true)
          if [ -z "$SM" ]; then
            mkdir -p "$SDK/cmdline-tools"
            curl -fsSL -o "$RUNNER_TEMP/cmd.zip" https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q "$RUNNER_TEMP/cmd.zip" -d "$SDK/cmdline-tools"
            mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
            SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          fi
          yes | "$SM" --licenses >/dev/null || true
          "$SM" "platforms;android-36" "build-tools;36.0.0"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
      - name: Build
        run: chmod +x ./gradlew && ./gradlew :app:assembleDebug --no-daemon --stacktrace
      - name: Collect APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Velo.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.9.${{ github.run_number }}
          name: Velo ${{ github.run_number }}
          files: Velo.apk
          make_latest: true
          body: |
            Android test build of Velo.
            The home screen lists videos already on the phone. Allow video access when Android asks. Browse files is still there if a file is missing from the list.
            Download Velo.apk and open it on your phone. Android warns about an unknown developer on test installs. That is expected.
            Playback uses libVLC. Files stay on the phone.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
